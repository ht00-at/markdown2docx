<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6366F1"/>
      <stop offset="1" stop-color="#A855F7"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="dot" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FDE047"/>
      <stop offset="1" stop-color="#F59E0B"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FBBF24" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#FBBF24" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="0.6"/>
    </filter>
  </defs>

  <!-- 背景圆角矩形 -->
  <rect width="48" height="48" rx="9.6" fill="url(#bg)"/>
  <!-- 顶部高光 -->
  <rect width="48" height="25" rx="9.6" fill="url(#glow)"/>

  <!-- 文档阴影 -->
  <rect x="12" y="13.5" width="24" height="29.76" fill="#000000" opacity="0.12" filter="url(#blur)"/>

  <!-- 文档主体 -->
  <rect x="12" y="12" width="24" height="29.76" fill="#FFFFFF"/>
  <!-- 折页 -->
  <polygon points="30,12 36,18 30,18" fill="#E4E4EC"/>
  <line x1="30" y1="12" x2="36" y2="18" stroke="#C4C4D2" stroke-width="0.3"/>
  <line x1="30" y1="18" x2="36" y2="18" stroke="#C4C4D2" stroke-width="0.2"/>

  <!-- fx 公式符号 -->
  <text x="24" y="26" font-family="'Segoe UI', Arial, sans-serif" font-size="12.5" font-weight="bold" fill="#6D28D9" text-anchor="middle">fx</text>

  <!-- 文档底部线条 -->
  <line x1="15.4" y1="30.5" x2="32.6" y2="30.5" stroke="#6D28D9" stroke-width="0.8" opacity="0.75"/>
  <line x1="15.4" y1="34" x2="25.9" y2="34" stroke="#6D28D9" stroke-width="0.8" opacity="0.75"/>

  <!-- AI 光晕 -->
  <circle cx="35.4" cy="11.4" r="5" fill="url(#halo)"/>
  <!-- AI 光点 -->
  <circle cx="35.4" cy="11.4" r="3.1" fill="url(#dot)"/>
  <!-- 中心亮核 -->
  <circle cx="35.4" cy="11.4" r="1.1" fill="#FFFFFF" opacity="0.75"/>
</svg>
